<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S3 Mídia · Painel</title>
<style>body{margin:0;background:#f4f4f1;color:#171717;font:16px Arial}header,nav,main{padding:20px;max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}button,a,input{font:inherit}button{cursor:pointer;padding:12px 18px;border:1px solid #ddd;border-radius:10px;background:white}nav{display:flex;gap:8px}button[aria-pressed=true]{background:#111;color:white}section{background:white;padding:24px;border-radius:18px;margin-bottom:20px}input{padding:12px;border:1px solid #ccc;border-radius:8px;max-width:90%}form{display:flex;flex-wrap:wrap;gap:12px}article{padding:18px 0;border-bottom:1px solid #ddd}article button{margin:6px}dt{font-weight:bold;margin-top:16px}dd{margin:6px 0;white-space:pre-wrap}iframe{width:100%;height:85vh;border:0}#message{padding:0 20px;white-space:pre-wrap}a{color:inherit}</style>
<header><strong>S3 MÍDIA</strong><button id="logout" hidden>Sair</button></header><p id="message" role="status"></p>
<main><section id="login"><h1>Acesso ao painel</h1><form id="loginForm"><input name="email" type="email" placeholder="E-mail" aria-label="E-mail" autocomplete="username" required><input name="password" type="password" placeholder="Senha" aria-label="Senha" autocomplete="current-password" required><button>Entrar</button></form></section>
<div id="panel" hidden><nav aria-label="Áreas"><button id="briefings" aria-pressed="true">Briefings</button><button id="proposals" aria-pressed="false">Propostas</button></nav>
<div id="briefingsView"><section><h1>Clientes e respostas</h1><form id="clientForm"><input name="nome" placeholder="Nome completo" aria-label="Nome completo" required maxlength="180"><input name="email" type="email" placeholder="E-mail" aria-label="E-mail do cliente"><input name="telefone" placeholder="Telefone" aria-label="Telefone"><button>Criar link individual</button></form></section><section id="clients"></section><section id="responses" hidden></section></div>
<div id="proposalsView" hidden><p id="sync" role="status"></p><button id="saveCloud">Salvar propostas no Firebase</button><button id="downloadBackup">Baixar cópia das propostas</button><iframe id="proposalFrame" title="Gerador de propostas"></iframe></div></div></main><script type="module" src="/admin.js"></script></html>
